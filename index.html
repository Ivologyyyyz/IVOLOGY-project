<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiet Garden — Mindful Gesture Sanctuary</title>
    
    <!-- Google Fonts for Editorial Typographic Vibe -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    
    <script>
      let resourceLoadErrorOccurred = false;
      let failedResourceName = "";

      // Cascade Multi-tier CDNs for robust MediaPipe loading
      const MEDIA_PIPE_CDNS = [
        {
          name: "字节跳动 CDN (Scoped)",
          camera_utils: "https://lf6-cdn-tos.bytecdntp.com/cdn/expire-1-M/@mediapipe/camera_utils/camera_utils.js",
          hands: "https://lf6-cdn-tos.bytecdntp.com/cdn/expire-1-M/@mediapipe/hands/hands.js",
          face_mesh: "https://lf6-cdn-tos.bytecdntp.com/cdn/expire-1-M/@mediapipe/face_mesh/face_mesh.js",
          locateFileBase: "https://lf6-cdn-tos.bytecdntp.com/cdn/expire-1-M/@mediapipe/hands/",
          locateFileFaceBase: "https://lf6-cdn-tos.bytecdntp.com/cdn/expire-1-M/@mediapipe/face_mesh/"
        },
        {
          name: "字节跳动 CDN (Flat)",
          camera_utils: "https://lf6-cdn-tos.bytecdntp.com/cdn/expire-1-M/mediapipe__camera_utils/camera_utils.js",
          hands: "https://lf6-cdn-tos.bytecdntp.com/cdn/expire-1-M/mediapipe__hands/hands.js",
          face_mesh: "https://lf6-cdn-tos.bytecdntp.com/cdn/expire-1-M/mediapipe__face_mesh/face_mesh.js",
          locateFileBase: "https://lf6-cdn-tos.bytecdntp.com/cdn/expire-1-M/mediapipe__hands/",
          locateFileFaceBase: "https://lf6-cdn-tos.bytecdntp.com/cdn/expire-1-M/mediapipe__face_mesh/"
        },
        {
          name: "jsDelivr 官方",
          camera_utils: "https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js",
          hands: "https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js",
          face_mesh: "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js",
          locateFileBase: "https://cdn.jsdelivr.net/npm/@mediapipe/hands/",
          locateFileFaceBase: "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/"
        },
        {
          name: "unpkg 镜像",
          camera_utils: "https://unpkg.com/@mediapipe/camera_utils/camera_utils.js",
          hands: "https://unpkg.com/@mediapipe/hands/hands.js",
          face_mesh: "https://unpkg.com/@mediapipe/face_mesh/face_mesh.js",
          locateFileBase: "https://unpkg.com/@mediapipe/hands/",
          locateFileFaceBase: "https://unpkg.com/@mediapipe/face_mesh/"
        },
        {
          name: "gcore 海外镜像",
          camera_utils: "https://gcore.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js",
          hands: "https://gcore.jsdelivr.net/npm/@mediapipe/hands/hands.js",
          face_mesh: "https://gcore.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js",
          locateFileBase: "https://gcore.jsdelivr.net/npm/@mediapipe/hands/",
          locateFileFaceBase: "https://gcore.jsdelivr.net/npm/@mediapipe/face_mesh/"
        }
      ];

      let mediaPipeLoaded = false;
      let activeCdnLocateBase = "https://cdn.jsdelivr.net/npm/@mediapipe/hands/";
      let activeCdnLocateFaceBase = "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/";
      let startMediaPipeEnginePending = false;

      // MP module proxies to isolate context loading
      const actualHandsModule = {
        preloadResults: {}
      };
      const actualFaceMeshModule = {
        preloadResults: {}
      };
      window.__activeMPContext = null;

      function getActiveTargetModule(prop) {
        if (window.__activeMPContext === "hands") return actualHandsModule;
        if (window.__activeMPContext === "face_mesh") return actualFaceMeshModule;
        
        // Check document.currentScript
        if (document.currentScript && document.currentScript.src) {
          const src = document.currentScript.src.toLowerCase();
          if (src.includes("hands")) return actualHandsModule;
          if (src.includes("face_mesh")) return actualFaceMeshModule;
        }
        
        // Filter by call stack
        const stack = new Error().stack || "";
        if (stack.includes("hands") || stack.includes("Hands") || stack.includes("mediapipe__hands") || stack.includes("mediapipe_hands")) {
          return actualHandsModule;
        }
        if (stack.includes("face_mesh") || stack.includes("mediapipe__face_mesh") || stack.includes("mediapipe_face_mesh") || stack.includes("faceMesh")) {
          return actualFaceMeshModule;
        }
        
        // Filter by property name if passed
        if (prop) {
          const propStr = String(prop);
          if (propStr.includes("hands") || propStr.includes("hands_solution")) {
            return actualHandsModule;
          }
          if (propStr.includes("face_mesh") || propStr.includes("face_mesh_solution") || propStr.includes("face_mesh_solution_packed_assets")) {
            return actualFaceMeshModule;
          }
        }
        
        return actualHandsModule; // fallback
      }

      // Suffix filename matching for preloadResults keys (crucial for different CDNs!)
      const findPreloadedResult = (prop) => {
        const propStr = String(prop);
        const filename = propStr.substring(propStr.lastIndexOf('/') + 1);
        
        // 1. Try exact match in hands
        if (actualHandsModule.preloadResults && actualHandsModule.preloadResults[prop]) {
          return actualHandsModule.preloadResults[prop];
        }
        // 2. Try exact match in face_mesh
        if (actualFaceMeshModule.preloadResults && actualFaceMeshModule.preloadResults[prop]) {
          return actualFaceMeshModule.preloadResults[prop];
        }
        
        // 3. Match by filename suffix in hands
        if (actualHandsModule.preloadResults) {
          for (const key of Object.keys(actualHandsModule.preloadResults)) {
            if (key.endsWith(filename)) {
              return actualHandsModule.preloadResults[key];
            }
          }
        }
        // 4. Match by filename suffix in face_mesh
        if (actualFaceMeshModule.preloadResults) {
          for (const key of Object.keys(actualFaceMeshModule.preloadResults)) {
            if (key.endsWith(filename)) {
              return actualFaceMeshModule.preloadResults[key];
            }
          }
        }
        
        return undefined;
      };

      const unifiedPreloadResults = new Proxy({}, {
        get(target, prop) {
          const res = findPreloadedResult(prop);
          if (res !== undefined) return res;
          
          const defaultTarget = getActiveTargetModule(prop);
          if (!defaultTarget.preloadResults) defaultTarget.preloadResults = {};
          if (!defaultTarget.preloadResults[prop]) {
            defaultTarget.preloadResults[prop] = {};
          }
          return defaultTarget.preloadResults[prop];
        },
        set(target, prop, value) {
          const keyStr = String(prop);
          const tgt = keyStr.includes("face_mesh") ? actualFaceMeshModule : actualHandsModule;
          if (!tgt.preloadResults) tgt.preloadResults = {};
          tgt.preloadResults[prop] = value;
          return true;
        },
        has(target, prop) {
          return findPreloadedResult(prop) !== undefined;
        }
      });

      const moduleProxy = new Proxy({}, {
        get(target, prop) {
          if (prop === "isProxy") return true;
          if (prop === "arguments" || prop === "arguments_") return undefined; // Protect against Emscripten arguments_ abort
          if (prop === "preloadResults") return unifiedPreloadResults;
          
          if (prop === "locateFile") {
            return (file) => {
              const isFace = file.includes("face_mesh") || file.includes("face_effect") || file.includes("geometry") || file.includes("face_landmark");
              const base = isFace 
                ? (window.activeCdnLocateFaceBase || 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/')
                : (window.activeCdnLocateBase || 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/');
              return `${base}${file}`;
            };
          }
          
          const activeModule = getActiveTargetModule(prop);
          if (prop in activeModule) {
            return activeModule[prop];
          }
          return undefined;
        },
        defineProperty(target, prop, descriptor) {
          if (prop === "arguments" || prop === "arguments_") return true;
          const activeModule = getActiveTargetModule(prop);
          try {
            Object.defineProperty(activeModule, prop, descriptor);
          } catch (e) {
            console.warn("defineProperty fail for " + String(prop), e);
          }
          return true;
        },
        getOwnPropertyDescriptor(target, prop) {
          if (prop === "arguments" || prop === "arguments_") return undefined;
          const activeModule = getActiveTargetModule(prop);
          const desc = Object.getOwnPropertyDescriptor(activeModule, prop);
          if (desc) {
            desc.configurable = true;
          }
          return desc;
        },
        set(target, prop, value) {
          if (prop === "arguments" || prop === "arguments_") return true;
          if (prop === "preloadResults") {
            if (value && typeof value === 'object') {
              for (const k of Object.keys(value)) {
                const tgt = k.includes("face_mesh") ? actualFaceMeshModule : actualHandsModule;
                if (!tgt.preloadResults) tgt.preloadResults = {};
                tgt.preloadResults[k] = value[k];
              }
            }
            return true;
          }
          
          const activeModule = getActiveTargetModule(prop);
          activeModule[prop] = value;
          const propStr = String(prop);
          if (["canvas", "onRuntimeInitialized", "preRun", "postRun"].includes(propStr)) {
            actualHandsModule[prop] = value;
            actualFaceMeshModule[prop] = value;
          }
          return true;
        },
        has(target, prop) {
          if (prop === "arguments" || prop === "arguments_") return false;
          if (prop === "preloadResults") return true;
          const activeModule = getActiveTargetModule(prop);
          return (prop in activeModule);
        },
        deleteProperty(target, prop) {
          if (prop === "arguments" || prop === "arguments_") return true;
          if (prop === "preloadResults") return true;
          const activeModule = getActiveTargetModule(prop);
          delete activeModule[prop];
          return true;
        }
      });

      try {
        Object.defineProperty(window, 'Module', {
          get() {
            return moduleProxy;
          },
          set(value) {
            if (value && typeof value === 'object') {
              const activeModule = getActiveTargetModule();
              for (const key of Object.keys(value)) {
                if (key === "preloadResults") {
                  const val = value[key];
                  if (val && typeof val === 'object') {
                    for (const k of Object.keys(val)) {
                      const tgt = k.includes("face_mesh") ? actualFaceMeshModule : actualHandsModule;
                      if (!tgt.preloadResults) tgt.preloadResults = {};
                      tgt.preloadResults[k] = val[k];
                    }
                  }
                } else if (key !== "arguments") {
                  activeModule[key] = value[key];
                }
              }
            }
          },
          configurable: true
        });
      } catch (e) {
        console.warn("[MediaPipe Isolation] DefineProperty fallback:", e);
        window.Module = moduleProxy;
      }

      function loadSingleScript(url) {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = url;
          script.crossOrigin = 'anonymous';
          script.onload = () => resolve();
          script.onerror = (err) => reject(err);
          document.head.appendChild(script);
        });
      }

      function loadMediaPipe(cdnIndex) {
        if (mediaPipeLoaded) return Promise.resolve();
        if (cdnIndex >= MEDIA_PIPE_CDNS.length) {
          resourceLoadErrorOccurred = true;
          failedResourceName = "camera_utils.js / hands.js / face_mesh.js";
          console.error("[MediaPipe Loader] All custom CDNs failed to initialize!");
          return Promise.reject(new Error("ALL_CDNS_FAILED"));
        }

        const cdn = MEDIA_PIPE_CDNS[cdnIndex];
        return loadSingleScript(cdn.camera_utils)
          .then(() => loadSingleScript(cdn.hands))
          .then(() => loadSingleScript(cdn.face_mesh))
          .then(() => {
            console.log(`[MediaPipe] Sequenced loading succeeded via ${cdn.name}!`);
            mediaPipeLoaded = true;
            activeCdnLocateBase = cdn.locateFileBase;
            activeCdnLocateFaceBase = cdn.locateFileFaceBase;
            // Expose values globally for React runtime
            window.mediaPipeLoaded = true;
            window.activeCdnLocateBase = cdn.locateFileBase;
            window.activeCdnLocateFaceBase = cdn.locateFileFaceBase;
          })
          .catch((err) => {
            console.warn(`[MediaPipe] Fallback triggered from ${cdn.name}:`, err);
            return loadMediaPipe(cdnIndex + 1);
          });
      }

      // Pre-load MediaPipe on context initialize
      loadMediaPipe(0);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
